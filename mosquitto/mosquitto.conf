# Local development broker only. Anonymous access on 1883 so the opt-in
# integration tests (and a local PierPressure run) can connect with no
# credentials. Do NOT use this config for anything exposed to a network.
listener 1883
allow_anonymous true

# Ephemeral: no persistence, so retained messages never carry over between test
# runs and each `docker compose up` starts from a clean broker.
persistence false
