[project]
name = "pierpressure"
dynamic = ["version"]
description = "Decides whether tonight is worth setting up for from a pier, and delivers the verdict into Home Assistant over MQTT."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "paho-mqtt>=2",
    "PyYAML",
    "skyfield>=1.55",
    "skyfield-data>=7.0.0",
    "httpx>=0.28.1",
    "pydantic-ai-slim[anthropic,google,openai]>=2.43.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The git tag is the only source of the version (ADR-0013). A build without git
# history and without SETUPTOOLS_SCM_PRETEND_VERSION gets a placeholder that is
# not CalVer, so it never claims to be a release.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+unreleased"

[tool.hatch.build.targets.wheel]
packages = ["pierpressure"]

# The vendored OpenNGC catalog (CSV) and its license (txt) are package data the
# core reads at runtime, so they must ship in the wheel regardless of VCS state
# or any future gitignore rule (see NOTICE, ADR-0008).
[tool.hatch.build]
artifacts = [
    "pierpressure/data/openngc/*.csv",
    "pierpressure/data/openngc/*.txt",
]

[dependency-groups]
# Synced by default by `uv sync`, so `just check` has its tools locally and in CI.
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
    "jsonschema",
    "types-PyYAML",
]

[tool.uv]
# One uv minor range for the dev shell, CI and the image (design D5). uv enforces
# this itself, so any environment that drifts out of range stops with an error.
required-version = ">=0.12.17,<0.13"
# Rebuild the editable project when the commit or tags change, so the reported
# version follows the latest tag (design D1).
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["pierpressure"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

# Skyfield and its data package ship no type information; treat them as an
# untyped boundary (values cross as Any) confined to core/sky.py.
[[tool.mypy.overrides]]
module = ["skyfield.*", "skyfield_data.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: opt-in tests that require a real local MQTT broker (deselected by default)",
]
addopts = "-m 'not integration'"
filterwarnings = [
    # Skyfield 1.55's find_discrete sets an array dtype in-place, which NumPy 2.5
    # deprecates. Upstream, not ours; both versions are lockfile-pinned.
    "ignore:Setting the dtype on a NumPy array has been deprecated:DeprecationWarning:skyfield",
    # pydantic-graph calls asyncio.get_event_loop() when the explainer's Pydantic AI
    # run_sync executes on a worker thread with no running loop. Upstream, not ours.
    "ignore:There is no current event loop:DeprecationWarning:pydantic_graph",
]
