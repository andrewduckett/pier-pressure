# PierPressure development tools. `mise install` installs them; with
# `mise activate` in your shell, they are on PATH whenever you are in the repo.
#
# Python is not listed: uv installs the version in .python-version, its only pin.

[tools]
# Keep inside [tool.uv] required-version in pyproject.toml (design D5).
uv = "0.12"
just = "1"
node = "26"
gh = "2.102"
# The OpenSpec CLI is an ordinary pin. Renovate moves it with the other tools.
"npm:@fission-ai/openspec" = "1.13.2"
# Let's Spec: the agent skills, OpenSpec schemas and working rules. Renovate moves
# only the version, so the asset pattern is a glob.
"github:sidereal-io/lets-spec" = { version = "0.6.0", asset_pattern = "lets-spec-*.tar.gz" }

[env]
# The image's Python version, which compose.yaml needs (#45).
PYTHON_VERSION = "{{ read_file(path='.python-version') | trim }}"
LETS_SPEC_FLOW = "standard"

[hooks]
# Keeps the Let's Spec skills and rules in step with the pin above.
enter = "lets sync"
