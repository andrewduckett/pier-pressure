# PierPressure development tools. `mise install` installs them; with
# `mise activate` in your shell, they are on PATH whenever you are in the repo.
#
# Python is not listed: uv installs the version in .python-version, its only pin.

[tools]
# Keep inside [tool.uv] required-version in pyproject.toml (design D5).
uv = "0.12"
node = "26"
gh = "2.103.3"
# The OpenSpec CLI is an ordinary pin. Renovate moves it with the other tools.
"npm:@fission-ai/openspec" = "1.16.1"
# Let's Spec: the agent skills, OpenSpec schemas and working rules. Renovate moves
# only the version, so the asset pattern is a glob.
"github:sidereal-io/lets-spec" = { version = "0.7.0", asset_pattern = "lets-spec-*.tar.gz" }

[env]
# The image's Python version, which compose.yaml needs (#45).
PYTHON_VERSION = "{{ read_file(path='.python-version') | trim }}"
LETS_SPEC_FLOW = "standard"

[hooks]
# Keeps the Let's Spec skills and rules in step with the pin above.
enter = "lets sync"

# Thin wrappers over uv (design D10). `mise tasks` lists them.
[tasks.install]
description = "Sync the environment, dependencies, and lockfile."
run = [{ task = "card-install" }, "uv sync"]

[tasks.lint]
description = "Lint with ruff."
run = "uv run ruff check ."

[tasks.format]
description = "Format with ruff."
run = "uv run ruff format ."

[tasks.typecheck]
description = "Type-check the package and scripts with mypy."
run = "uv run mypy"

[tasks.test]
description = "Run the test suite."
run = "uv run pytest"

[tasks.run]
description = "Run the service."
run = "uv run python -m pierpressure"

[tasks.card-install]
description = "Install the dashboard card's npm packages from the lockfile."
dir = "{{config_root}}/card"
# npm ci empties node_modules first, so it runs only when the lockfile has
# changed since the last install. Install scripts are refused; none is needed.
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm ci --ignore-scripts --no-audit --no-fund"

[tasks.card]
description = "Type-check, test and build the dashboard card into card/dist/."
depends = ["card-install"]
dir = "{{config_root}}/card"
run = ["npm run typecheck", "npm test", "npm run build"]

[tasks.specs]
description = "Validate the main specs with OpenSpec in strict mode."
# Strict mode fails on any OpenSpec warning, such as a requirement over 500 characters.
run = "openspec validate --specs --strict --no-interactive"

[tasks.check]
description = "The full gate CI runs: specs + lint + typecheck + test + the card."
# Task references run in order and stop at the first failure. The spec check
# takes a second, so it goes first and fails fast.
run = [
  { task = "specs" },
  { task = "lint" },
  { task = "typecheck" },
  { task = "test" },
  { task = "card" },
]

[tasks.broker-up]
description = "Start a local Mosquitto broker (dev only, anonymous on 1883)."
run = "docker compose up -d mosquitto"

[tasks.up]
description = "Run PierPressure in its image against a local broker. Needs ./config.yaml."
run = "docker compose --profile full up --build"

[tasks.broker-down]
description = "Stop the local dev stack."
run = "docker compose down"

[tasks.dashboard-check]
description = "Start a throwaway Home Assistant with the PierPressure card, for checking it by eye."
depends = ["card"]
run = "uv run python scripts/dashboard_check.py"

[tasks.test-integration]
description = "Run the opt-in integration tests against a throwaway local broker."
# Tear the whole stack down even when the tests fail, and keep pytest's status.
run = '''
#!/usr/bin/env bash
set -uo pipefail
docker compose up -d --wait mosquitto
uv run pytest -m integration
status=$?
docker compose down
exit $status
'''
