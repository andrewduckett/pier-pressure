# PierPressure as a Home Assistant add-on (app). Home Assistant pulls the
# released image at this version and never builds one (design D1).
name: PierPressure
# Each release opens a pull request that moves this line to the new version
# (design D5). Quoted so YAML keeps it a string.
version: "2026.10.0"
slug: pierpressure
description: Decides whether tonight is worth setting up for, and what to point at.
url: https://github.com/andrewduckett/pier-pressure
# Exactly the platforms the release image is built for (tests/test_ha_addon.py).
arch:
  - amd64
  - aarch64
image: ghcr.io/andrewduckett/pier-pressure
# The add-on's own config folder, mounted at /config, holds the user's
# optional config.yaml (design D3). The form below lists the piers; config.yaml
# adds the settings the form leaves unset (addon-form-horizon-file).
map:
  - addon_config
environment:
  PIERPRESSURE_CONFIG: /config/config.yaml
# The Configuration form. Its names match config.yaml's; the service moves
# interval_seconds under recompute (addon-options-form D1, D5). The labels live
# in translations/en.yaml.
options:
  interval_seconds: 900
  piers: []
  # The broker block must be listed here, because the Supervisor cannot mark a
  # block optional. Its fields are optional instead, and port has no default, so
  # an empty block sets no broker (addon-form-broker D1).
  mqtt: {}
schema:
  interval_seconds: int(1,)
  piers:
    - id: str
      latitude: float(-90,90)
      longitude: float(-180,180)
      elevation_m: float
      # The pier's horizon, flattened because the form nests only two levels:
      # a floor, or points as text the service parses. The check on save wants
      # blank text, or text in [[ and ]] (addon-form-horizon D4).
      min_altitude: float(0,90)?
      horizon_points: 'match(^\s*(\[\s*\[.*\]\s*\])?\s*$)?'
      # The pier's equipment, flattened for the same reason; the service rebuilds
      # the equipment block. The save check allows 0, because its bound is
      # inclusive; the service rejects 0 (addon-form-equipment D4).
      equipment_focal_length_mm: float(0,)?
      equipment_sensor_width_mm: float(0,)?
      equipment_sensor_height_mm: float(0,)?
      equipment_reducer: float(0,)?
      # The pier's gates, with config.yaml's names. Neither is in options, so a
      # new pier starts with both empty; the service leaves out an empty one. The
      # save check allows a max_gust of 0; the service rejects it (addon-form-gates D2).
      go_threshold: int(0,100)?
      max_gust: float(0,)?
  # The broker, with config.yaml's names. Setting host takes all four from the
  # form; leaving it empty takes them from config.yaml, or else from the
  # Supervisor (addon-form-broker D1, addon-form-horizon-file).
  mqtt:
    host: str?
    port: port?
    username: str?
    password: password?
# Ask the Supervisor for the broker another add-on (usually Mosquitto) provides.
# "want", not "need", so the add-on still installs with any other broker. Used
# only when the settings name no mqtt.host (ha-addon-mqtt-service).
services:
  - mqtt:want
