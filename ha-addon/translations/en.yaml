# Labels for the add-on's Configuration form (addon-options-form D6). Every key
# in config.yaml's schema needs an entry here (tests/test_ha_addon.py).
configuration:
  interval_seconds:
    name: Recompute interval
    description: How often to recompute the verdict, in seconds. 900 is 15 minutes.
  piers:
    name: Piers
    description: >-
      The places you observe from. Each pier gets its own verdict device. List
      at least one. For a setting this form does not show, such as a horizon
      file, add the pier to config.yaml with the same ID and only that setting.
    fields:
      id:
        name: Pier ID
        description: >-
          A short name for the pier, such as backyard. It becomes part of the MQTT
          topics and entity IDs, so keep it to letters, digits and underscores.
      latitude:
        name: Latitude
        description: In degrees, from -90 to 90. Positive is north of the equator.
      longitude:
        name: Longitude
        description: In degrees, from -180 to 180. Positive is east of Greenwich.
      elevation_m:
        name: Elevation
        description: Height above sea level, in metres.
      min_altitude:
        name: Horizon floor
        description: >-
          Optional. The lowest altitude a target must reach, in degrees from 0 to
          90, the same in every direction. Leave it empty when you set horizon
          points; the two cannot be used together.
      horizon_points:
        name: Horizon points
        description: >-
          Optional. Your horizon as [azimuth, altitude] pairs in degrees, on one
          line, such as [[0, 10], [90, 25], [180, 5]]. Leave it empty when you set
          a horizon floor; the two cannot be used together.
      equipment_focal_length_mm:
        name: Focal length
        description: >-
          Optional. Your telescope's focal length, in millimetres. Set it with
          sensor width and sensor height; the three go together.
      equipment_sensor_width_mm:
        name: Sensor width
        description: >-
          Optional. Your camera sensor's width, in millimetres. Set it with focal
          length and sensor height; the three go together.
      equipment_sensor_height_mm:
        name: Sensor height
        description: >-
          Optional. Your camera sensor's height, in millimetres. Set it with focal
          length and sensor width; the three go together.
      equipment_reducer:
        name: Reducer or barlow
        description: >-
          Optional. The factor of a focal reducer or barlow, with no unit, such
          as 0.8 or 2. Leave it empty for 1.0, when you use neither.
      go_threshold:
        name: GO threshold
        description: >-
          Optional. The score from 0 to 100, with no unit, that a night needs for
          GO. Leave it empty for 65.
      max_gust:
        name: Wind-gust limit
        description: >-
          Optional. The wind gust, in km/h, above which the night is NO-GO. Leave
          it empty for no wind gate, so no forecast gust makes the night NO-GO.
  mqtt:
    name: MQTT broker
    description: >-
      Optional. The broker to publish to. Leave the host empty to use the broker
      set in config.yaml, or else the Mosquitto broker add-on.
    fields:
      host:
        name: Host
        description: >-
          The broker's host name or IP address, such as 192.168.1.10. When you set
          it, the add-on takes the host, port, username and password from this
          form only.
      port:
        name: Port
        description: >-
          Optional. The broker's port, a number from 1 to 65535 with no unit.
          Leave it empty for 1883, the usual MQTT port. Set it only with a host.
      username:
        name: Username
        description: >-
          Optional. The name the add-on logs in with, if your broker needs a
          login. Set it only with a host.
      password:
        name: Password
        description: >-
          Optional. The password the add-on logs in with. The form hides it as
          you type. Set it only with a host.
