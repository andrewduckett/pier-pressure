# Local development stack.
#
#   mise run broker-up     # just the broker (for integration tests)
#   mise run up            # broker + PierPressure against it
#   mise run broker-down   # stop everything
#   mise run dashboard-check  # broker + PierPressure + a throwaway Home Assistant
#
# Compose needs PYTHON_VERSION to read this file, even for the broker alone.
# mise.toml sets it from .python-version; elsewhere, set it yourself,
# e.g. `PYTHON_VERSION=$(cat .python-version) docker compose ...`.
#
# The broker allows anonymous access on 1883 — dev only (see mosquitto/mosquitto.conf).
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      # A publish succeeds only once the listener is accepting connections.
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "ok"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: run PierPressure against the local broker. Enable with `mise run up`.
  # Needs a ./config.yaml pointing mqtt.host at "mosquitto"; the dashboard check
  # names its own through PIERPRESSURE_HOST_CONFIG.
  pierpressure:
    profiles: ["full", "dashboard"]
    build:
      context: .
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:?set it from .python-version, or run through mise run}
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ${PIERPRESSURE_HOST_CONFIG:-./config.yaml}:/app/config.yaml:ro
    environment:
      PIERPRESSURE_MQTT_PASSWORD: "${PIERPRESSURE_MQTT_PASSWORD:-}"

  # A throwaway Home Assistant for checking the PierPressure card. Dev only: started
  # by `mise run dashboard-check`, which writes its config (scripts/dashboard_check.py).
  homeassistant:
    profiles: ["dashboard"]
    image: ghcr.io/home-assistant/home-assistant:2026.10.4
    depends_on:
      mosquitto:
        condition: service_healthy
    # Loopback only: its owner login is in scripts/dashboard_check.py.
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ./.workspace/dashboard-check/config:/config
