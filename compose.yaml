# Local development stack.
#
#   just broker-up     # just the broker (for integration tests)
#   just up            # broker + PierPressure against it
#   just broker-down   # stop everything
#
# Compose needs PYTHON_VERSION to read this file, even for the broker alone. The
# Justfile and the Nix dev shell set it from .python-version; elsewhere, set it
# yourself, e.g. `PYTHON_VERSION=$(cat .python-version) docker compose ...`.
#
# The broker allows anonymous access on 1883 — dev only (see mosquitto/mosquitto.conf).
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      # A publish succeeds only once the listener is accepting connections.
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "ok"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: run PierPressure against the local broker. Enable with `just up`.
  # Needs a ./config.yaml pointing mqtt.host at "mosquitto".
  pierpressure:
    profiles: ["full"]
    build:
      context: .
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:?set it from .python-version, or run through just}
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      PIERPRESSURE_MQTT_PASSWORD: "${PIERPRESSURE_MQTT_PASSWORD:-}"
