name: Release

# Cuts one versioned release by hand (design D3): re-run the checks, compute the
# next CalVer version, push a multi-arch image to GHCR, then tag the commit and
# create the GitHub release. Last, open a pull request that moves the Home Assistant
# add-on to the new version. Only a manual trigger on main releases anything.
on:
  workflow_dispatch:

# One release at a time, so two runs never pick the same version. A waiting run
# is never cancelled by the running one; a newer trigger replaces the waiting run.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The dev shell gives the job the Python, uv and just that a developer gets:
      # Python from .python-version, uv and just from flake.lock (#45).
      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', '.python-version') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', '.python-version') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Sync dependencies
        run: nix develop -c uv sync --frozen

      - name: Run checks
        run: nix develop -c just check

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub release; push the add-on branch
      packages: write # push the image to GHCR
      pull-requests: write # open the add-on version pull request
    steps:
      - name: Refuse to release from any branch but main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases run only from main, not $REF"
            exit 1
          fi

      # Full history and tags, so the version script sees every release tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A re-run, or a run that waited in the queue, keeps its original commit.
      # Release it only if it is still the latest commit on main.
      - name: Refuse to release a commit that is no longer the latest on main
        run: |
          latest="$(git rev-parse origin/main)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_SHA is not the latest commit on main ($latest)"
            exit 1
          fi

      # Fails if HEAD already carries a release tag: each commit releases once.
      - name: Compute the next version
        id: version
        run: |
          version="$(python3 scripts/next_version.py)"
          echo "Releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Read the Python version
        id: python
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      # arm64 builds under QEMU emulation on the amd64 runner (design D4).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags plus the OCI version, revision and source metadata. The annotations go
      # on each platform manifest and on the index, which GHCR reads to link the
      # package to this repository. The io.hass labels are the ones Home Assistant
      # reads from add-on images (ha-addon design D6).
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            io.hass.version=${{ steps.version.outputs.version }}
            io.hass.type=addon
          annotations: org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            PIERPRESSURE_VERSION=${{ steps.version.outputs.version }}
            PYTHON_VERSION=${{ steps.python.outputs.version }}

      # Last, and only once the push succeeds: a release never exists without its
      # image. `gh release create` also creates the tag on the released commit.
      - name: Tag the commit and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: gh release create "$VERSION" --target "$SHA" --title "$VERSION" --generate-notes

      # After the release, so the pull request only ever names an image that exists
      # (ha-addon design D5). One fixed branch, force-pushed, keeps at most one
      # version pull request open. The release never pushes to main: the
      # maintainer merges the pull request to deliver the update to add-on users.
      - name: Open the add-on version pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
          BRANCH: release/ha-addon-version
        run: |
          trap 'echo "::error::Could not open or update the add-on version pull request for $VERSION. The image, tag and release stand; open the pull request by hand."' ERR

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --force-create "$BRANCH" "$SHA"
          python3 scripts/set_addon_version.py "$VERSION"
          # Someone already set this version on main by hand: there is nothing to propose.
          if git diff --quiet -- ha-addon/config.yaml; then
            echo "The add-on is already at $VERSION; no pull request needed."
            exit 0
          fi
          git commit --message "chore: move the Home Assistant add-on to $VERSION" -- ha-addon/config.yaml
          git push --force origin "HEAD:refs/heads/$BRANCH"

          title="chore: move the Home Assistant add-on to $VERSION"
          body="Release $VERSION is published. Merge this pull request to offer it to Home Assistant add-on users.

          It changes only the version in \`ha-addon/config.yaml\`. CI does not run on a pull request that a workflow opens, and main needs a passing check before a merge. Close and reopen this pull request to run CI, then merge."
          number="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
          else
            gh pr edit "$number" --title "$title" --body "$body"
          fi
