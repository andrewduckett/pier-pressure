name: CI

# On push and PR, runs the full gate (`just check` = lint + typecheck + test),
# the opt-in integration tests against a throwaway Mosquitto broker, and an image build.
# The checks run inside the Nix dev shell, so CI tests what developers run.
# Activates once the repo is pushed to GitHub.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The dev shell gives the job the Python, uv and just that a developer gets:
      # Python from .python-version, uv and just from flake.lock (#45).
      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', '.python-version') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', '.python-version') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Sync dependencies
        run: nix develop -c uv sync --frozen

      - name: Run checks
        run: nix develop -c just check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The dev shell gives the job the Python, uv and just that a developer gets:
      # Python from .python-version, uv and just from flake.lock (#45).
      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', '.python-version') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', '.python-version') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Sync dependencies
        run: nix develop -c uv sync --frozen

      # Brings up the Compose broker (--wait for healthy), runs
      # `pytest -m integration`, and tears the stack down even on failure.
      - name: Run integration tests
        run: nix develop -c just test-integration

  # Builds the release image (amd64 only, not pushed), so a pull request that
  # changes the Dockerfile, the base image or the uv stage is tested before it
  # merges. Dependabot's Docker updates rely on this job (#26).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the Python version
        id: python
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: PYTHON_VERSION=${{ steps.python.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
