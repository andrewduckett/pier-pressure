name: CI

# On push and PR, runs the full gate (`just check` = lint + typecheck + test),
# the opt-in integration tests against a throwaway Mosquitto broker, and an image build.
# Activates once the repo is pushed to GitHub.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run checks
        run: just check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      # Brings up the Compose broker (--wait for healthy), runs
      # `pytest -m integration`, and tears the stack down even on failure.
      - name: Run integration tests
        run: just test-integration

  # Builds the release image (amd64 only, not pushed), so a pull request that
  # changes the Dockerfile, the base image or the uv stage is tested before it
  # merges. Dependabot's Docker updates rely on this job (#26).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
