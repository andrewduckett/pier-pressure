name: CI

# On push and PR, runs the full gate (`mise run check` = lint + typecheck + test),
# the opt-in integration tests against a throwaway Mosquitto broker, and an image build.
# The checks run with the tools in mise.toml, so CI tests what developers run.
# Activates once the repo is pushed to GitHub.
on:
  push:
    branches: [main]
  pull_request:
  # A merge queue runs the required checks on each queued change before it merges.
  merge_group:

# Only the latest changes are processed. A new push to a pull request cancels
# the run it supersedes. Pushes to main are never cancelled, so every commit on
# main keeps its own result: that history is how a breaking merge is found. In a
# merge queue each entry has its own ref, so entries never cancel each other;
# each tests a different combination of queued changes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mise gives the job the tools a developer gets: uv and the others in mise.toml,
      # and Python from .python-version through uv (#45).
      - name: Install mise and its tools
        uses: jdx/mise-action@v5

      - name: Cache uv packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', '.python-version') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Sync dependencies
        run: mise exec -- uv sync --frozen

      - name: Run checks
        run: mise run check

      # Fails when the Let's Spec rules, skills or schemas differ from the
      # release pinned in mise.toml. Fix: run `lets sync` and commit what it wrote.
      - name: Check the Let's Spec files
        run: mise exec -- lets sync --check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mise gives the job the tools a developer gets: uv and the others in mise.toml,
      # and Python from .python-version through uv (#45).
      - name: Install mise and its tools
        uses: jdx/mise-action@v5

      - name: Cache uv packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', '.python-version') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Sync dependencies
        run: mise exec -- uv sync --frozen

      # Brings up the Compose broker (--wait for healthy), runs
      # `pytest -m integration`, and tears the stack down even on failure.
      - name: Run integration tests
        run: mise run test-integration

  # Builds the release image (amd64 only, not pushed), so a pull request that
  # changes the Dockerfile, the base image or the uv stage is tested before it
  # merges. Renovate's Docker updates rely on this job (#119).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the Python version
        id: python
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: PYTHON_VERSION=${{ steps.python.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
