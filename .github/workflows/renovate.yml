name: Renovate

# Runs Renovate once a day, which opens the dependency update pull requests
# (#119, ADR-0024). The rules live in .github/renovate.json5; this file holds
# only what the runner sets. On a pull request that changes either file, it
# checks the config instead.
#
# Renovate runs from npm with the tools in mise.toml, so `uv lock` and
# `lets sync` behave in its clone as they do for a developer.
on:
  schedule:
    - cron: "17 4 * * *"
  # The first run, and retries.
  workflow_dispatch:
  pull_request:
    paths:
      - .github/renovate.json5
      - .github/workflows/renovate.yml

permissions: {}

# One version for the scheduled run and the config check. Renovate updates both
# through these comments, in the weekly Actions pull request. Node stays inside
# the range Renovate's package.json `engines` allows.
env:
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: "44.181.8"
  # renovate: datasource=node-version depName=node
  RENOVATE_NODE_VERSION: "24"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install mise and its tools
        uses: jdx/mise-action@v5

      # --no-global checks it as a repository config, so a runner-only option
      # such as allowedCommands fails here instead of being ignored at run time.
      - name: Check the Renovate config
        run: >-
          mise exec node@"$RENOVATE_NODE_VERSION" --
          npx --yes --package renovate@"$RENOVATE_VERSION" --
          renovate-config-validator --strict --no-global .github/renovate.json5

  renovate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The app token does the writing. This token only reads, for mise's downloads.
    permissions:
      contents: read
    concurrency:
      group: renovate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Install mise and its tools
        uses: jdx/mise-action@v5

      # Renovate's child processes find uv and lets through the shims, which pick
      # the versions in the mise.toml of Renovate's clone.
      - name: Put mise's shims on PATH
        run: echo "${MISE_DATA_DIR:-$HOME/.local/share/mise}/shims" >> "$GITHUB_PATH"

      # Pull requests opened with the workflow's own token don't trigger CI, and
      # main requires the check and image checks. The token expires in an hour.
      - name: Get a token for the Renovate app
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # The input accepts an app ID as well as a client ID.
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      # A repository config can't widen any of these settings.
      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_ALLOWED_COMMANDS: '["^lets sync$"]'
          RENOVATE_BINARY_SOURCE: global
          # A known path for Renovate's clone, which mise is told to trust.
          RENOVATE_BASE_DIR: ${{ runner.temp }}/renovate
          MISE_READ_TOKEN: ${{ github.token }}
        # Child processes such as `uv lock` and `lets sync` get a reduced
        # environment, so the mise settings are passed in explicitly. The app
        # token never reaches them.
        run: |
          RENOVATE_CUSTOM_ENV_VARIABLES="$(jq -cn \
            --arg dir "$RENOVATE_BASE_DIR" --arg token "$MISE_READ_TOKEN" \
            '{MISE_TRUSTED_CONFIG_PATHS: $dir, MISE_GITHUB_TOKEN: $token}')"
          export RENOVATE_CUSTOM_ENV_VARIABLES
          mise exec node@"$RENOVATE_NODE_VERSION" -- npx --yes renovate@"$RENOVATE_VERSION"
