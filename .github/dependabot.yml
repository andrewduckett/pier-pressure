# Weekly dependency update pull requests (#26). Minor and patch updates arrive as
# one grouped pull request per ecosystem; each major update arrives on its own, so
# a breaking change is easy to review and revert. CI decides whether an update is
# safe: `just check` and the integration tests run on every pull request, and the
# image build covers the Docker updates. Nothing merges automatically.
version: 2

updates:
  # pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      uv-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The actions used in .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The FROM lines in the Dockerfile: the Python base image and the uv stage.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The Python version changes only through .python-version, never through a
      # bot pull request. To Dependabot, 3.12-slim -> 3.13-slim is a minor update.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The inputs locked in flake.lock, which give the dev shell its Python, uv and just.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
