# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  proposal:
    - "Write in plain language per ISO 24495-1: reader-first, purposefully structured, findable, understandable, and actionable."
  specs:
    - "Write in plain language per ISO 24495 (core -1; technical content also -3): reader-first, structured, findable, and actionable."
  design:
    - "Write in plain language per ISO 24495 (core -1; technical content also -3): reader-first, structured, findable, and actionable."
  adr:
    - "Write in plain language per ISO 24495 (core -1; technical content also -3): reader-first, structured, findable, and actionable."
  review:
    - "Write in plain language per ISO 24495-1: reader-first, purposefully structured, findable, understandable, and actionable."

