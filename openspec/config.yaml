schema: lets-standard

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  PierPressure decides "is tonight worth setting up for, and what should I point
  at from this pier?" and delivers a verdict into Home Assistant. Product intent
  lives in openspec/prd.md.

  Durable constraints (honor in every artifact):
  - Core is pure Python 3.14+ with zero Home Assistant imports; it is
    deterministic and testable off Home Assistant (same inputs, including a
    pinned evaluation instant, yield the same verdict document).
  - The core emits ONE JSON verdict document; that document plus the MQTT entity
    mapping are the stable contract all milestones build against. What is frozen
    is the delivery surface (topics, entities, entity mapping) and the meaning of
    existing fields — never reshape those. Growing the document ADDITIVELY (new
    fields/objects) as a milestone's science arrives is allowed and expected;
    reserve a field early (stubbed) when its shape is already known, but do not
    invent a shape before the milestone that defines it.
  - Delivery to Home Assistant is via MQTT discovery (auto-created entities);
    REST is an acceptable fallback adapter. Home Assistant must never be
    load-bearing for freshness or correctness.
  - The core runs as a persistent container that owns its own freshness:
    recompute on startup, on a configurable interval, and on demand via a
    "show me now" MQTT command surfaced as a refresh button. Notification timing
    lives in a Home Assistant automation, not the core.
  - Verdict model: hard GATES (any fail -> NO-GO with a reason and null score)
    then a banded 0-100 SCORE only when gates pass; reasons[] are the itemized
    gate/score terms.
  - Target observability windows are hard-clamped to astronomical night (sun
    below -18 degrees), regardless of any user-requested view window.
  - confidence {band: LOW|MEDIUM|HIGH, value: 0-100} reflects forecast
    lead-time/freshness and rises as dusk nears.
  - No single external data source is load-bearing: providers sit behind an
    interface with graceful fallback.
  - The LLM layer is optional and never feeds the astronomy/ephemeris math; it
    only explains an already-computed verdict. The system degrades gracefully
    without it.
  - Astronomy stack: Skyfield / Astroplan / Astropy.
  - Toolchain: uv (env/deps/lockfile), mise (task runner), ruff (lint AND
    format - no black), mypy (types), pytest (tests), pre-commit, GitHub
    Actions CI running `mise run check`. Python 3.14, pinned only in
    .python-version.

# The code review rule. lets-spec put it here, and your project owns it:
# delete it to stop code reviews, or edit it to change when they run.
# OpenSpec keeps a project's rules for finishing a change under
# operations.archive. lets-build follows them once every task is done,
# before it runs verify.
operations:
  archive:
    guidance:
      - >-
        Every change gets one code review before it is verified. If the
        pull request description has no **Code review** section, run the
        `lets-review-code` skill now. Otherwise check the section as that
        skill's *Check an earlier review* section says, and run the skill
        again only when it tells you to.
